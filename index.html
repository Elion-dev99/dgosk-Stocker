<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="Appleライクな在庫管理PWA">
  <title>Stockly</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar glass">
      <div>
        <p class="eyebrow" id="headerEyebrow">在庫管理</p>
        <h1 id="headerTitle">ホーム</h1>
      </div>
      <button class="icon-button" id="notificationButton" aria-label="通知">
        <span aria-hidden="true">◌</span><i class="notification-dot"></i>
      </button>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="tabbar glass" aria-label="メインナビゲーション">
      <button class="tab is-active" data-route="home"><span>⌂</span><small>ホーム</small></button>
      <button class="tab" data-route="products"><span>▣</span><small>商品</small></button>
      <button class="scan-tab" data-route="scan" aria-label="スキャン"><span>⌗</span></button>
      <button class="tab" data-route="history"><span>◫</span><small>履歴</small></button>
      <button class="tab" data-route="settings"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="transactionSheet" aria-modal="true" role="dialog" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle"></div>
    <button class="sheet-close icon-button" id="sheetClose" aria-label="閉じる">×</button>
    <p class="eyebrow" id="sheetKind">在庫操作</p>
    <h2 id="sheetTitle">入庫登録</h2>
    <div class="selected-product" id="sheetProduct"></div>
    <form id="transactionForm">
      <label class="field-label" for="quantity">数量</label>
      <div class="quantity-control">
        <button type="button" id="decreaseQuantity" aria-label="数量を減らす">−</button>
        <input id="quantity" name="quantity" type="number" min="1" step="1" value="1" inputmode="numeric" required>
        <button type="button" id="increaseQuantity" aria-label="数量を増やす">＋</button>
      </div>
      <label class="field-label" for="memo">備考</label>
      <textarea id="memo" name="memo" rows="3" maxlength="100" placeholder="例：仕入れ分"></textarea>
      <p class="form-error" id="formError" role="alert"></p>
      <button class="primary-button" type="submit" id="submitTransaction">登録する</button>
    </form>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
