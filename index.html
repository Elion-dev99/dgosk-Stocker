<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="月2回の棚卸と消費分析を行う在庫管理システム">
  <title>StockPilot | 在庫管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="loginView" class="login-view">
    <div class="login-visual">
      <div class="brand brand-large"><span class="brand-mark">SP</span><span>StockPilot</span></div>
      <div class="hero-copy">
        <p class="eyebrow">INVENTORY INTELLIGENCE</p>
        <h1>在庫を数えるだけで、<br>消費の未来が見える。</h1>
        <p>月2回の在庫チェックから、消費量、在庫切れ予測、推奨発注量を自動算出します。</p>
      </div>
      <div class="feature-strip"><span>在庫チェック</span><span>消費分析</span><span>発注提案</span></div>
    </div>
    <div class="login-panel">
      <form id="loginForm" class="login-card" novalidate>
        <div class="mobile-brand brand"><span class="brand-mark">SP</span><span>StockPilot</span></div>
        <p class="eyebrow">WELCOME BACK</p>
        <h2>ログイン</h2>
        <p class="muted">管理画面にアクセスします</p>
        <label>メールアドレス<input id="loginEmail" type="email" value="admin@example.com" autocomplete="username" required></label>
        <label>パスワード
          <span class="password-wrap"><input id="loginPassword" type="password" value="password123" autocomplete="current-password" required><button type="button" id="togglePassword" class="icon-button" aria-label="パスワードを表示">表示</button></span>
        </label>
        <label class="check-row"><input id="rememberLogin" type="checkbox" checked><span>ログイン状態を保持</span></label>
        <p id="loginError" class="error-text" role="alert"></p>
        <button type="submit" class="primary-button full">ログイン</button>
        <div class="demo-box"><strong>デモアカウント</strong><br>admin@example.com / password123</div>
      </form>
    </div>
  </section>

  <section id="appView" class="app-view hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="brand-mark">SP</span><span>StockPilot</span></div>
      <nav id="mainNav" class="nav-list" aria-label="メインメニュー">
        <button data-view="dashboard" class="active"><span>▦</span>ダッシュボード</button>
        <button data-view="products"><span>箱</span>商品管理</button>
        <button data-view="stocktake"><span>✓</span>在庫チェック</button>
        <button data-view="analytics"><span>↗</span>消費分析</button>
        <button data-view="orders"><span>発</span>発注提案</button>
        <button data-view="history"><span>履</span>履歴・CSV</button>
        <button data-view="settings"><span>⚙</span>設定</button>
      </nav>
      <div class="sidebar-footer"><div class="avatar">管</div><div><strong>管理者</strong><small>admin@example.com</small></div><button id="logoutButton" class="logout-button">退出</button></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button id="menuButton" class="menu-button" aria-label="メニュー">☰</button>
        <div><p id="pageEyebrow" class="eyebrow">OVERVIEW</p><h1 id="pageTitle">ダッシュボード</h1></div>
        <div class="top-actions"><span id="todayLabel" class="date-chip"></span><button id="quickStocktake" class="primary-button">在庫を記録</button></div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon-button">閉じる</button></div><div id="modalBody"></div></div></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="csvFileInput" type="file" accept=".csv,text/csv" hidden>
  <script src="js/app.js"></script>
</body>
</html>
