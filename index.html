<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockPilot Phase 1</title><link rel="stylesheet" href="css/style.css"></head><body>
<section id="login" class="login"><form id="loginForm" class="login-card"><div class="logo">SP</div><p class="eyebrow">WAREHOUSE MANAGEMENT</p><h1>StockPilot</h1><p>在庫・倉庫管理システム</p><label>メールアドレス<input id="email" type="email" value="admin@example.com" required></label><label>パスワード<input id="password" type="password" value="password123" required></label><p id="error" class="error"></p><button>ログイン</button><small>デモ: admin@example.com / password123</small></form></section>
<section id="app" class="app hidden"><aside><div class="brand"><b>SP</b> StockPilot</div><nav id="nav"><button data-view="dashboard" class="active">ダッシュボード</button><button data-view="products">商品管理</button><button data-view="warehouses">倉庫管理</button><button data-view="locations">ロケーション管理</button><button data-view="inventory">在庫一覧</button><button data-view="stocktakes">棚卸管理</button></nav><button id="logout" class="logout">ログアウト</button></aside><div class="workspace"><header><button id="menu">☰</button><div><p class="eyebrow" id="eyebrow">OVERVIEW</p><h1 id="title">ダッシュボード</h1></div><button id="quick" class="primary">＋ 棚卸入力</button></header><main id="content"></main></div></section>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button id="close">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div><script src="js/app.js"></script></body></html>
