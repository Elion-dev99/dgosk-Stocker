<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>WMS Login</title>

  ./css/style.css
</head>
<body>

<div class="login-wrapper">

  <div class="login-card">

    <div class="logo-area">
      <h1>WMS PRO</h1>
      <p>在庫・消費分析システム</p>
    </div>

    <form id="loginForm">

      <div class="input-group">
        <label for="email">
          メールアドレス
        </label>

        <input
          id="email"
          type="email"
          placeholder="admin@example.com"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">
          パスワード
        </label>

        <input
          id="password"
          type="password"
          placeholder="********"
          required
        >
      </div>

      <div
        id="errorMessage"
        class="error-message"
      >
        メールアドレスまたはパスワードが正しくありません
      </div>

      <button type="submit">
        ログイン
      </button>

    </form>

    <div class="footer">
      © 2026 WMS PRO
    </div>

  </div>

</div>

./js/app.js>

</body>
</html>
